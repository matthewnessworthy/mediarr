[package]
name = "mediarr-core"
version = "0.1.14"
edition = "2021"
description = "Core library for Mediarr media file renaming and organisation"
license = "GPL-3.0-only"

[dependencies]
hunch = "2.0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
dirs = "7.0.0"
thiserror = "2.0.20"
tracing = "0.1.44"
isolang = { version = "2.4.0", features = ["english_names", "lowercase_names"] }
walkdir = "2.5.0"
sanitize-filename = "0.6.0"
regex = "1.13.1"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
